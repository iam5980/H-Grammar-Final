<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#FF8C42">
<title>Grammar 5 Final Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Nunito', system-ui, -apple-system, sans-serif;
    background-color: #FFF8E7;
    color: #222;
    line-height: 1.5;
    -webkit-tap-highlight-color: transparent;
    -webkit-font-smoothing: antialiased;
  }
  button { font-family: inherit; cursor: pointer; border: none; background: none; }
  input, textarea { font-family: inherit; }
  input:focus, textarea:focus { outline: none; }

  /* Animations */
  @keyframes pop {
    0% { transform: scale(0.8); opacity: 0; }
    50% { transform: scale(1.05); }
    100% { transform: scale(1); opacity: 1; }
  }
  @keyframes bounceIn {
    0% { transform: scale(0.3); opacity: 0; }
    50% { transform: scale(1.1); }
    100% { transform: scale(1); opacity: 1; }
  }
  @keyframes celebrate {
    0% { transform: scale(0) rotate(0deg); opacity: 0; }
    50% { transform: scale(1.2) rotate(180deg); }
    100% { transform: scale(1) rotate(360deg); opacity: 1; }
  }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }
  .anim-pop { animation: pop 0.4s ease-out; }
  .anim-bounce { animation: bounceIn 0.5s ease-out; }
  .anim-celebrate { animation: celebrate 0.8s ease-out; }
  .anim-float { animation: float 2.5s ease-in-out infinite; }

  /* Layout */
  .container { max-width: 720px; margin: 0 auto; padding: 0 16px; }

  /* === HOME PAGE === */
  .home { min-height: 100vh; padding-bottom: 40px; }
  .hero {
    background: linear-gradient(135deg, #FF8C42 0%, #FFB84D 100%);
    padding: 32px 20px 40px;
    border-radius: 0 0 32px 32px;
    text-align: center;
    color: #FFF;
    box-shadow: 0 4px 20px rgba(255, 140, 66, 0.25);
  }
  .hero-icon { font-size: 36px; margin-bottom: 8px; }
  .hero-title {
    font-family: 'Fredoka', sans-serif;
    font-size: 28px;
    font-weight: 700;
    margin: 0 0 6px;
  }
  .hero-subtitle { font-size: 14px; opacity: 0.95; font-weight: 600; }
  .hero-stats {
    margin-top: 16px;
    display: inline-flex;
    gap: 12px;
    font-size: 13px;
    background-color: rgba(255, 255, 255, 0.2);
    padding: 8px 18px;
    border-radius: 20px;
    font-weight: 700;
  }
  .howto {
    background-color: #FFF;
    padding: 14px 16px;
    border-radius: 16px;
    border: 2px dashed #FFD79A;
    font-size: 13.5px;
    color: #666;
    line-height: 1.7;
    margin-top: 20px;
  }
  .howto-label {
    font-weight: 700;
    color: #FF8C42;
    margin-bottom: 6px;
    font-family: 'Fredoka', sans-serif;
  }
  .quiz-list { margin-top: 20px; display: grid; gap: 14px; }
  .quiz-card {
    background-color: #FFF;
    border: 3px solid;
    border-radius: 18px;
    padding: 16px 18px;
    cursor: pointer;
    text-align: left;
    display: flex;
    align-items: center;
    gap: 14px;
    transition: transform 0.2s, box-shadow 0.2s;
    box-shadow: 0 3px 10px rgba(0, 0, 0, 0.04);
    width: 100%;
  }
  .quiz-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 10px 24px rgba(0, 0, 0, 0.1);
  }
  .quiz-card:active { transform: translateY(-2px); }
  .quiz-icon-wrap {
    width: 56px; height: 56px;
    border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
    font-size: 28px; flex-shrink: 0;
  }
  .quiz-info { flex: 1; min-width: 0; }
  .quiz-title {
    font-family: 'Fredoka', sans-serif;
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 2px;
  }
  .quiz-subtitle { font-size: 12px; color: #888; margin-bottom: 4px; }
  .quiz-count { font-size: 12px; font-weight: 700; }
  .quiz-arrow { font-size: 22px; flex-shrink: 0; }
  .footer-msg {
    background-color: #FFF6E0;
    border-radius: 16px;
    padding: 16px;
    text-align: center;
    font-size: 13px;
    color: #A0703D;
    font-weight: 600;
    margin-top: 24px;
  }

  /* === Study Plan Card === */
  .study-plan {
    background: linear-gradient(135deg, #FFFAEC 0%, #FFEFD0 100%);
    border-radius: 20px;
    padding: 18px 18px 14px;
    margin-top: 20px;
    border: 2px solid #FFD79A;
    box-shadow: 0 4px 12px rgba(255, 140, 66, 0.08);
  }
  .study-plan-title {
    font-family: 'Fredoka', sans-serif;
    font-size: 15px;
    font-weight: 700;
    color: #C76A1A;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .study-plan-steps {
    display: flex;
    align-items: stretch;
    gap: 6px;
  }
  .plan-step {
    flex: 1;
    background-color: #FFF;
    border-radius: 12px;
    padding: 10px 8px;
    text-align: center;
    border: 1.5px solid #FFE4B5;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 78px;
  }
  .plan-num {
    width: 26px; height: 26px;
    border-radius: 50%;
    background-color: #FF8C42;
    color: #FFF;
    font-family: 'Fredoka', sans-serif;
    font-weight: 700;
    font-size: 13px;
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 6px;
    flex-shrink: 0;
  }
  .plan-name {
    font-family: 'Fredoka', sans-serif;
    font-size: 13px;
    font-weight: 700;
    color: #444;
    line-height: 1.2;
    margin-bottom: 2px;
  }
  .plan-desc {
    font-size: 10.5px;
    color: #888;
    font-weight: 600;
    line-height: 1.3;
  }
  .plan-arrow {
    color: #FFB84D;
    font-size: 16px;
    font-weight: 800;
    align-self: center;
    flex-shrink: 0;
  }

  /* === Category Section === */
  .category-section {
    margin-top: 28px;
  }
  .category-header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
    border-radius: 16px;
    margin-bottom: 12px;
    border: 2px solid;
  }
  .category-icon-wrap {
    width: 44px; height: 44px;
    border-radius: 12px;
    background-color: #FFF;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
    flex-shrink: 0;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.06);
  }
  .category-info { flex: 1; min-width: 0; }
  .category-title {
    font-family: 'Fredoka', sans-serif;
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 2px;
  }
  .category-subtitle {
    font-size: 12px;
    opacity: 0.8;
    margin-bottom: 3px;
  }
  .category-timing {
    font-size: 11px;
    font-weight: 700;
    opacity: 0.7;
  }
  .category-count-badge {
    background-color: rgba(255, 255, 255, 0.6);
    padding: 4px 10px;
    border-radius: 12px;
    font-size: 12px;
    font-weight: 700;
    flex-shrink: 0;
  }

  /* Quiz card compact mode (inside category) */
  .quiz-list-compact {
    display: grid;
    gap: 10px;
  }
  .quiz-card-compact {
    background-color: #FFF;
    border: 2px solid;
    border-radius: 14px;
    padding: 12px 14px;
    cursor: pointer;
    text-align: left;
    display: flex;
    align-items: center;
    gap: 12px;
    transition: transform 0.2s, box-shadow 0.2s;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.03);
    width: 100%;
  }
  .quiz-card-compact:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 14px rgba(0, 0, 0, 0.08);
  }
  .quiz-card-compact:active { transform: translateY(0); }
  .quiz-icon-compact {
    width: 40px; height: 40px;
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; flex-shrink: 0;
  }
  .quiz-info-compact { flex: 1; min-width: 0; }
  .quiz-title-compact {
    font-family: 'Fredoka', sans-serif;
    font-size: 14px;
    font-weight: 700;
    line-height: 1.3;
    margin-bottom: 2px;
  }
  .quiz-count-compact {
    font-size: 11.5px;
    font-weight: 700;
  }
  .quiz-arrow-compact {
    font-size: 18px;
    flex-shrink: 0;
  }

  /* === QUIZ PAGE === */
  .quiz-page { min-height: 100vh; }
  .progress-bar {
    position: sticky; top: 0; z-index: 10;
    background-color: #FFF8E7;
    border-bottom: 2px dashed #FFD79A;
    padding: 12px 16px;
  }
  .progress-top {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 8px;
  }
  .back-btn { font-size: 14px; color: #666; }
  .progress-count {
    font-family: 'Fredoka', sans-serif;
    font-weight: 600; font-size: 15px; color: #444;
  }
  .progress-track {
    height: 8px;
    background-color: #FFEAC1;
    border-radius: 4px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%; background-color: #FF8C42;
    transition: width 0.4s ease;
    border-radius: 4px;
  }
  .progress-label {
    font-size: 12px; color: #888; margin-top: 6px;
    text-align: center;
    font-family: 'Fredoka', sans-serif;
    font-weight: 500;
  }
  .quiz-content {
    max-width: 720px; margin: 0 auto;
    padding: 20px 16px 120px;
  }
  .reading-box {
    background-color: #FFF;
    padding: 16px 18px;
    border-radius: 16px;
    margin-bottom: 16px;
    border: 2px solid #FFD79A;
    box-shadow: 0 4px 12px rgba(255, 140, 66, 0.08);
  }
  .reading-label {
    font-size: 13px; color: #FF8C42; font-weight: 700;
    margin-bottom: 8px; font-family: 'Fredoka', sans-serif;
  }
  .reading-text { font-size: 15px; line-height: 1.7; color: #333; }
  .reading-hint-small {
    background-color: #FFF6E0;
    padding: 8px 12px;
    border-radius: 10px;
    margin-bottom: 12px;
    font-size: 12px;
    color: #A0703D;
  }
  .question-card {
    background-color: #FFF;
    padding: 24px 22px;
    border-radius: 20px;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.06);
    border: 3px solid #FFE4B5;
  }
  .q-tag-row {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 14px;
  }
  .q-num {
    background-color: #FF8C42; color: #FFF;
    padding: 4px 12px; border-radius: 20px;
    font-size: 13px; font-weight: 700;
    font-family: 'Fredoka', sans-serif;
  }
  .q-type { font-size: 12px; color: #999; font-weight: 600; }
  .q-text {
    font-size: 17px; line-height: 1.7; color: #222;
    white-space: pre-wrap; margin-bottom: 20px;
    font-weight: 500;
  }

  /* MCQ */
  .mcq-list { display: flex; flex-direction: column; gap: 10px; }
  .mcq-option {
    text-align: left;
    padding: 14px 16px;
    border-radius: 14px;
    border: 2.5px solid #E5E5E5;
    background-color: #FFF;
    font-size: 15px; font-weight: 600; color: #333;
    transition: all 0.2s;
    display: flex; align-items: center; gap: 10px;
    width: 100%;
  }
  .mcq-option:hover:not(:disabled) {
    border-color: #FFB84D;
    background-color: #FFF9F0;
  }
  .mcq-option:disabled { cursor: default; }
  .mcq-option.selected { border-color: #FF8C42; background-color: #FFF1E0; }
  .mcq-option.correct { border-color: #6BCB77; background-color: #E8F8E8; }
  .mcq-option.wrong { border-color: #FF6B6B; background-color: #FFE4E4; }
  .mcq-letter {
    width: 28px; height: 28px; border-radius: 50%;
    background-color: #F0F0F0; color: #999;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 13px; flex-shrink: 0;
    font-family: 'Fredoka', sans-serif;
  }
  .mcq-option.selected .mcq-letter { background-color: #FF8C42; color: #FFF; }
  .mcq-option.correct .mcq-letter { background-color: #6BCB77; color: #FFF; }
  .mcq-option.wrong .mcq-letter { background-color: #FF6B6B; color: #FFF; }
  .mcq-text { flex: 1; }

  /* Input */
  .text-input {
    width: 100%; padding: 14px 16px;
    font-size: 17px;
    border: 2.5px solid #FFD79A;
    border-radius: 14px;
    background-color: #FFFEF8;
    color: #333; font-weight: 600;
  }
  .text-input.correct { border-color: #6BCB77; background-color: #E8F8E8; }
  .text-input.wrong { border-color: #FF6B6B; background-color: #FFE4E4; }
  .text-area {
    width: 100%; padding: 14px 16px;
    font-size: 16px;
    border: 2.5px solid #FFD79A;
    border-radius: 14px;
    background-color: #FFFEF8;
    color: #333; font-weight: 500;
    line-height: 1.5;
    resize: vertical;
  }
  .text-area.correct { border-color: #6BCB77; background-color: #E8F8E8; }
  .text-area.wrong { border-color: #FF6B6B; background-color: #FFE4E4; }

  /* Multi-fill */
  .multifill-row {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 10px;
  }
  .multifill-label {
    font-size: 13px; color: #FF8C42; font-weight: 700;
    min-width: 64px; font-family: 'Fredoka', sans-serif;
  }
  .multifill-input {
    flex: 1; padding: 12px 14px; font-size: 16px;
    border: 2.5px solid #FFD79A;
    border-radius: 12px;
    background-color: #FFFEF8;
    color: #333; font-weight: 600;
  }
  .multifill-input.correct { border-color: #6BCB77; background-color: #E8F8E8; }
  .multifill-input.wrong { border-color: #FF6B6B; background-color: #FFE4E4; }

  /* Hint */
  .hint-btn {
    background-color: #FFF6E0;
    color: #A0703D;
    border: 2px dashed #FFD79A;
    padding: 8px 14px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 700;
    margin-top: 14px;
  }
  .hint-box {
    background-color: #FFF6E0;
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 13.5px;
    color: #A0703D;
    border-left: 4px solid #FFB84D;
    margin-top: 14px;
  }

  /* Feedback */
  .feedback {
    margin-top: 18px;
    padding: 14px 16px;
    border-radius: 14px;
    border-left: 5px solid;
  }
  .feedback.correct { background-color: #E8F8E8; border-left-color: #6BCB77; }
  .feedback.wrong { background-color: #FFE4E4; border-left-color: #FF6B6B; }
  .feedback-title {
    font-size: 18px;
    font-weight: 800;
    margin-bottom: 8px;
    font-family: 'Fredoka', sans-serif;
  }
  .feedback.correct .feedback-title { color: #3A9B47; }
  .feedback.wrong .feedback-title { color: #D14848; }
  .feedback-body { font-size: 14px; color: #444; line-height: 1.7; }
  .feedback-row { margin-bottom: 6px; }
  .feedback-label { color: #888; }
  .feedback-user { color: #D14848; font-weight: 700; }
  .feedback-correct-ans { color: #3A9B47; font-weight: 700; }
  .feedback-hint-small {
    margin-top: 8px;
    padding: 8px 12px;
    background-color: #FFF;
    border-radius: 10px;
    font-size: 13px;
    color: #666;
  }

  /* Bottom action bar */
  .action-bar {
    position: fixed; bottom: 0; left: 0; right: 0;
    padding: 16px;
    background-color: rgba(255, 248, 231, 0.95);
    border-top: 2px solid #FFE4B5;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    z-index: 5;
  }
  .action-inner { max-width: 720px; margin: 0 auto; }
  .btn-action {
    width: 100%;
    padding: 16px;
    color: #FFF;
    border-radius: 16px;
    font-size: 17px;
    font-weight: 800;
    font-family: 'Fredoka', sans-serif;
    transition: opacity 0.2s, transform 0.1s;
  }
  .btn-action:active { transform: scale(0.98); }
  .btn-submit {
    background-color: #FF8C42;
    box-shadow: 0 4px 14px rgba(255, 140, 66, 0.4);
  }
  .btn-submit:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-next {
    background-color: #5EBEC4;
    box-shadow: 0 4px 14px rgba(94, 190, 196, 0.4);
  }

  /* === RESULTS PAGE === */
  .results-page { min-height: 100vh; padding-bottom: 40px; }
  .score-card {
    border-radius: 24px;
    padding: 32px 24px;
    text-align: center;
    color: #FFF;
    margin-top: 24px;
  }
  .score-emoji { font-size: 72px; margin-bottom: 8px; }
  .score-msg {
    font-family: 'Fredoka', sans-serif;
    font-size: 24px;
    font-weight: 700;
    margin-bottom: 16px;
  }
  .score-stats {
    display: flex; justify-content: center; gap: 24px;
    margin-bottom: 16px;
  }
  .score-stat-label {
    font-size: 12px; opacity: 0.9; font-weight: 700;
  }
  .score-stat-value {
    font-family: 'Fredoka', sans-serif;
    font-size: 48px; font-weight: 700; line-height: 1;
  }
  .score-stat-unit { font-size: 14px; opacity: 0.9; }
  .score-divider {
    width: 2px;
    background-color: rgba(255, 255, 255, 0.3);
  }
  .score-title { font-size: 13px; opacity: 0.9; font-weight: 600; }
  .result-actions {
    margin-top: 20px;
    display: grid; gap: 10px;
  }
  .btn-retry-wrong {
    padding: 14px;
    background-color: #FF6B6B; color: #FFF;
    border-radius: 14px;
    font-size: 16px; font-weight: 800;
    font-family: 'Fredoka', sans-serif;
    box-shadow: 0 4px 14px rgba(255, 107, 107, 0.3);
  }
  .btn-retry-all {
    padding: 14px;
    background-color: #5EBEC4; color: #FFF;
    border-radius: 14px;
    font-size: 16px; font-weight: 800;
    font-family: 'Fredoka', sans-serif;
    box-shadow: 0 4px 14px rgba(94, 190, 196, 0.3);
  }
  .btn-home {
    padding: 14px;
    background-color: #FFF; color: #666;
    border: 2px solid #DDD;
    border-radius: 14px;
    font-size: 15px; font-weight: 700;
  }
  .review-section { margin-top: 28px; }
  .review-title {
    font-family: 'Fredoka', sans-serif;
    font-size: 20px;
    color: #D14848;
    margin: 0 0 12px;
    display: flex; align-items: center; gap: 8px;
  }
  .review-list { display: grid; gap: 12px; }
  .review-item {
    background-color: #FFF;
    padding: 16px 18px;
    border-radius: 16px;
    border: 2px solid #FFD0D0;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
  }
  .review-num {
    font-size: 12px;
    color: #FF6B6B;
    font-weight: 800;
    margin-bottom: 6px;
    font-family: 'Fredoka', sans-serif;
  }
  .review-question {
    font-size: 15px; color: #333;
    margin-bottom: 10px;
    white-space: pre-wrap;
    line-height: 1.6;
    font-weight: 500;
  }
  .review-user, .review-correct {
    padding: 8px 12px;
    border-radius: 10px;
    margin-bottom: 6px;
    font-size: 13.5px;
  }
  .review-user { background-color: #FFE4E4; }
  .review-correct { background-color: #E8F8E8; }
  .review-hint-text {
    font-size: 12.5px;
    color: #888;
    margin-top: 6px;
    padding-left: 4px;
  }
  .all-correct-box {
    margin-top: 28px;
    text-align: center;
    padding: 40px 20px;
    background-color: #FFF;
    border-radius: 20px;
    border: 3px dashed #6BCB77;
  }
  .all-correct-emoji { font-size: 64px; margin-bottom: 12px; }
  .all-correct-text {
    font-family: 'Fredoka', sans-serif;
    font-size: 22px;
    color: #3A9B47;
    font-weight: 700;
  }
  .all-correct-sub { color: #666; margin-top: 8px; }
</style>
</head>
<body>
<div id="app"></div>

<script>
// ============================================================
// QUIZ DATA - 18 sets, 213 questions
// ============================================================
const quizSets = [
  // ─── 1. MCQ - Conditionals & Tenses ───
  { id: 'mcq_conditional', title: 'Multiple Choice ・ Conditionals & Tenses', subtitle: 'Choose the right answer', icon: '🎯', color: 'sky',
    questions: [
      { type: 'mcq', q: 'If we come home late, Mom ___ angry.', options: ['was', 'will be', 'will'], answer: 1, hint: 'First Conditional: If + present, will + base verb.' },
      { type: 'mcq', q: 'Peter will be ill if he ___ a lot of chocolate.', options: ['eats', 'will eat', 'eat'], answer: 0, hint: 'After "if", use present tense. "He" is third person singular → add -s.' },

      // ───── Part F: if or unless (4) ─────
      { type: 'mcq', q: "[Part F.1] ___ you finish your homework, you can't watch TV.", options: ['If', 'Unless'], answer: 1, hint: '"Unless" = only when homework is done, can watch TV.' },
      { type: 'mcq', q: '[Part F.2] ___ it stops raining, we will play outside.', options: ['If', 'Unless'], answer: 0, hint: '"If" rain stops → we CAN play outside.' },
      { type: 'mcq', q: "[Part F.3] ___ the alarm rings, we'll wake up on time.", options: ['If', 'Unless'], answer: 0, hint: '"If" alarm rings → good result (wake up on time).' },
      { type: 'mcq', q: "[Part F.4] ___ you bring your ticket, you can't enter the museum.", options: ['If', 'Unless'], answer: 1, hint: '"Unless" you bring ticket = if no ticket → no entry.' },

      // ───── Part G: Rewrite using "unless" (3) ─────
      { type: 'rewrite', q: "[Part G.1] Rewrite using \"unless\":\nHe won't pass the test if he doesn't study hard.", answer: ["He won't pass the test unless he studies hard.", "Unless he studies hard, he won't pass the test."], hint: '⚠️ "He" is singular → STUDIES (add -es)!' },
      { type: 'rewrite', q: "[Part G.2] Rewrite using \"unless\":\nI won't go to the party if you don't come with me.", answer: ["I won't go to the party unless you come with me.", "Unless you come with me, I won't go to the party."], hint: "don't come → unless you come." },
      { type: 'rewrite', q: "[Part G.3] Rewrite using \"unless\":\nShe can't sing well if she doesn't practice every day.", answer: ["She can't sing well unless she practices every day.", "Unless she practices every day, she can't sing well."], hint: '⚠️ "She" is singular → PRACTICES (add -es)!' },

      // ───── Part H: Passive Voice Rewrite (3) ─────
      { type: 'rewrite', q: '[Part H.1] Rewrite in passive voice:\nThe students wrote letters to soldiers yesterday.', answer: ['Letters were written to soldiers by the students yesterday.', 'Letters were written by the students to soldiers yesterday.'], hint: 'Object "letters" becomes subject. Past passive: were + written.' },
      { type: 'rewrite', q: '[Part H.2] Rewrite in passive voice:\nMy mom bakes cookies every Sunday.', answer: ['Cookies are baked by my mom every Sunday.'], hint: 'Object "cookies" (plural) becomes subject. Present passive: are + baked.' },
      { type: 'rewrite', q: '[Part H.3] Rewrite in passive voice:\nThey will build a new school next year.', answer: ['A new school will be built by them next year.', 'A new school will be built next year.'], hint: 'Future passive: WILL BE + past participle (built).' },

      // ───── Part I: First Conditional Rewrite (3) ─────
      { type: 'rewrite', q: "[Part I.1] Write a first conditional sentence:\nCondition: You don't drink enough water.\nResult: You feel thirsty.", answer: ["If you don't drink enough water, you will feel thirsty.", 'If you do not drink enough water, you will feel thirsty.'], hint: "feel → will feel (future result)." },
      { type: 'rewrite', q: '[Part I.2] Write a first conditional sentence:\nCondition: She studies hard.\nResult: She gets good grades.', answer: ['If she studies hard, she will get good grades.'], hint: 'studies (already correct form); get → will get.' },

    ]
  },
];

// ============================================================
// UTILITIES - normalize (contraction expansion) + isMatch
// ============================================================
function normalize(s) {
  if (!s) return '';
  let result = s.toLowerCase().trim();
  result = result
    .replace(/[\u2018\u2019`]/g, "'")
    .replace(/[\u201C\u201D]/g, '"');
  result = result
    .replace(/won't/g, 'will not')
    .replace(/can't/g, 'cannot')
    .replace(/shan't/g, 'shall not')
    .replace(/it's/g, 'it is')
    .replace(/that's/g, 'that is')
    .replace(/there's/g, 'there is')
    .replace(/he's/g, 'he is')
    .replace(/she's/g, 'she is')
    .replace(/what's/g, 'what is')
    .replace(/who's/g, 'who is')
    .replace(/where's/g, 'where is')
    .replace(/let's/g, 'let us')
    .replace(/n't/g, ' not')
    .replace(/'ll/g, ' will')
    .replace(/'d /g, ' would ')
    .replace(/'re/g, ' are')
    .replace(/'ve/g, ' have')
    .replace(/'m/g, ' am');
  result = result.replace(/[.,!?;:]/g, '');
  result = result.replace(/\s+/g, ' ').trim();
  return result;
}

function isMatch(userAnswer, correctAnswers) {
  const u = normalize(userAnswer);
  const candidates = Array.isArray(correctAnswers) ? correctAnswers : [correctAnswers];
  return candidates.some(c => normalize(c) === u);
}

// Utility: escape HTML
function esc(str) {
  if (str === undefined || str === null) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function renderQuiz() {
  const set = state.currentSet;
  const q = set.questions[state.qIndex];
  const progress = ((state.qIndex + (state.submitted ? 1 : 0)) / set.questions.length) * 100;
  const lastResult = state.results[state.results.length - 1];

  let inputHTML = '';
  if (q.type === 'mcq') {
    inputHTML = '<div class="mcq-list">' + q.options.map((opt, i) => {
      const sel = state.userAnswer === String(i);
      const correctChoice = state.submitted && i === q.answer;
      const wrongChoice = state.submitted && sel && i !== q.answer;
      let cls = 'mcq-option';
      if (correctChoice) cls += ' correct';
      else if (wrongChoice) cls += ' wrong';
      else if (sel) cls += ' selected';
      const symbol = correctChoice ? '✓' : wrongChoice ? '✗' : String.fromCharCode(65 + i);
      return `
        <button class="${cls}" data-action="mcq" data-idx="${i}" ${state.submitted ? 'disabled' : ''}>
          <span class="mcq-letter">${symbol}</span>
          <span class="mcq-text">${esc(opt)}</span>
        </button>
      `;
    }).join('') + '</div>';
  } else if (q.type === 'fill') {
    let cls = 'text-input';
    if (state.submitted) cls += lastResult.isCorrect ? ' correct' : ' wrong';
    inputHTML = `<input type="text" class="${cls}" data-action="fill-input" placeholder="Type your answer here..." value="${esc(state.userAnswer)}" ${state.submitted ? 'disabled' : ''} autofocus>`;
  } else if (q.type === 'multifill') {
    inputHTML = '<div>' + Array.from({ length: q.blanks }).map((_, i) => {
      let cls = 'multifill-input';
      if (state.submitted) {
        cls += isMatch(state.userMultiAnswers[i] || '', q.answer[i]) ? ' correct' : ' wrong';
      }
      return `
        <div class="multifill-row">
          <span class="multifill-label">Blank ${i + 1}:</span>
          <input type="text" class="${cls}" data-action="multifill-input" data-idx="${i}" placeholder="Answer ${i + 1}" value="${esc(state.userMultiAnswers[i] || '')}" ${state.submitted ? 'disabled' : ''} ${i === 0 ? 'autofocus' : ''}>
        </div>
      `;
    }).join('') + '</div>';
  } else if (q.type === 'rewrite') {
    let cls = 'text-area';
    if (state.submitted) cls += lastResult.isCorrect ? ' correct' : ' wrong';
    inputHTML = `<textarea class="${cls}" data-action="fill-input" rows="3" placeholder="Type the full sentence here..." ${state.submitted ? 'disabled' : ''} autofocus>${esc(state.userAnswer)}</textarea>`;
  }

  // Hint
  let hintHTML = '';
  if (!state.submitted && q.hint) {
    if (state.showHint) {
      hintHTML = `<div class="hint-box">💡 ${esc(q.hint)}</div>`;
    } else {
      hintHTML = `<button class="hint-btn" data-action="toggle-hint">💡 Show Hint</button>`;
    }
  }

  // Feedback
  let feedbackHTML = '';
  if (state.submitted) {
    const isC = lastResult.isCorrect;
    let correctAnsStr = '';
    if (q.type === 'mcq') correctAnsStr = q.options[q.answer];
    else if (q.type === 'multifill') correctAnsStr = q.answer.map(a => a[0]).join(' / ');
    else correctAnsStr = Array.isArray(q.answer) ? q.answer[0] : q.answer;

    feedbackHTML = `
      <div class="feedback ${isC ? 'correct' : 'wrong'} anim-bounce">
        <div class="feedback-title">${isC ? '🎉 Correct! Great job!' : "😅 Not quite — let's learn it!"}</div>
        ${!isC ? `
          <div class="feedback-body">
            <div class="feedback-row"><span class="feedback-label">Your answer: </span><span class="feedback-user">${esc(lastResult.userInput || '(blank)')}</span></div>
            <div class="feedback-row"><span class="feedback-label">Correct answer: </span><span class="feedback-correct-ans">${esc(correctAnsStr)}</span></div>
            ${q.hint ? `<div class="feedback-hint-small">💡 ${esc(q.hint)}</div>` : ''}
          </div>
        ` : ''}
      </div>
    `;
  }

  // Action button
  let actionBtnHTML = '';
  if (!state.submitted) {
    const disabled = (q.type === 'mcq' && state.userAnswer === '') ||
      (q.type === 'fill' && !state.userAnswer.trim()) ||
      (q.type === 'rewrite' && !state.userAnswer.trim()) ||
      (q.type === 'multifill' && (state.userMultiAnswers.length < q.blanks || state.userMultiAnswers.some(a => !a || !a.trim())));
    actionBtnHTML = `<button class="btn-action btn-submit" data-action="submit" ${disabled ? 'disabled' : ''}>✓ Submit Answer</button>`;
  } else {
    const isLast = state.qIndex === set.questions.length - 1;
    actionBtnHTML = `<button class="btn-action btn-next" data-action="next">${isLast ? 'Finish ・ See Results 🏆' : 'Next Question →'}</button>`;
  }

  // Reading intro
  let introHTML = '';
  if (set.intro && state.qIndex === 0) {
    introHTML = `
      <div class="reading-box">
        <div class="reading-label">📖 READING PASSAGE</div>
        <div class="reading-text">${esc(set.intro)}</div>
      </div>
    `;
  } else if (set.intro && state.qIndex > 0) {
    introHTML = `<div class="reading-hint-small">💡 Scroll up to read the passage again if needed.</div>`;
  }

  return `
    <div class="quiz-page">
      <div class="progress-bar">
        <div class="progress-top">
          <button class="back-btn" data-action="exit">← Back to Home</button>
          <span class="progress-count">${state.qIndex + 1} / ${set.questions.length}</span>
        </div>
        <div class="progress-track">
          <div class="progress-fill" style="width:${progress}%"></div>
        </div>
        <div class="progress-label">${set.icon} ${esc(set.title)}</div>
      </div>
      <div class="quiz-content">
        ${introHTML}
        <div class="question-card anim-pop">
          <div class="q-tag-row">
            <span class="q-num">Q${state.qIndex + 1}</span>
            <span class="q-type">・ ${typeLabels[q.type]}</span>
          </div>
          <div class="q-text">${esc(q.q)}</div>
          ${inputHTML}
          ${hintHTML}
          ${feedbackHTML}
        </div>
      </div>
      <div class="action-bar">
        <div class="action-inner">${actionBtnHTML}</div>
      </div>
    </div>
  `;
}

function renderResults() {
  const set = state.currentSet;
  const correct = state.results.filter(r => r.isCorrect).length;
  const total = state.results.length;
  const pct = Math.round((correct / total) * 100);
  const wrong = state.results.filter(r => !r.isCorrect);

  let emoji, msg, color;
  if (pct === 100) { emoji = '🏆'; msg = 'Perfect score! Amazing!'; color = '#FFB400'; }
  else if (pct >= 90) { emoji = '🌟'; msg = 'Excellent! Keep it up!'; color = '#6BCB77'; }
  else if (pct >= 70) { emoji = '👍'; msg = 'Good job! Keep going!'; color = '#5EBEC4'; }
  else if (pct >= 50) { emoji = '💪'; msg = 'Keep practicing!'; color = '#FF8C42'; }
  else { emoji = '📚'; msg = 'Practice makes perfect!'; color = '#FF6B6B'; }

  let reviewHTML = '';
  if (wrong.length > 0) {
    const items = wrong.map(r => {
      const q = set.questions[r.qIndex];
      let correctAnsStr = '';
      if (q.type === 'mcq') correctAnsStr = q.options[q.answer];
      else if (q.type === 'multifill') correctAnsStr = q.answer.map(a => a[0]).join(' / ');
      else correctAnsStr = Array.isArray(q.answer) ? q.answer.join('  OR  ') : q.answer;
      return `
        <div class="review-item">
          <div class="review-num">Q${r.qIndex + 1}</div>
          <div class="review-question">${esc(r.question)}</div>
          <div class="review-user"><span class="feedback-label" style="font-weight:700;">Your answer: </span><span class="feedback-user">${esc(r.userInput || '(blank)')}</span></div>
          <div class="review-correct"><span class="feedback-label" style="font-weight:700;">Correct: </span><span class="feedback-correct-ans">${esc(correctAnsStr)}</span></div>
          ${r.hint ? `<div class="review-hint-text">💡 ${esc(r.hint)}</div>` : ''}
        </div>
      `;
    }).join('');
    reviewHTML = `
      <div class="review-section">
        <h2 class="review-title">📝 Wrong Answers Review (${wrong.length})</h2>
        <div class="review-list">${items}</div>
      </div>
    `;
  } else {
    reviewHTML = `
      <div class="all-correct-box">
        <div class="all-correct-emoji">🎊🎉🎊</div>
        <div class="all-correct-text">All correct! Amazing!</div>
        <div class="all-correct-sub">No wrong answers to review. Try another set!</div>
      </div>
    `;
  }

  return `
    <div class="results-page">
      <div class="container">
        <div class="score-card" style="background: linear-gradient(135deg, ${color} 0%, ${color}DD 100%); box-shadow: 0 8px 24px ${color}44;">
          <div class="score-emoji anim-celebrate">${emoji}</div>
          <div class="score-msg">${msg}</div>
          <div class="score-stats">
            <div>
              <div class="score-stat-label">Score</div>
              <div class="score-stat-value">${pct}</div>
              <div class="score-stat-unit">pts</div>
            </div>
            <div class="score-divider"></div>
            <div>
              <div class="score-stat-label">Correct</div>
              <div class="score-stat-value">${correct}</div>
              <div class="score-stat-unit">/ ${total} questions</div>
            </div>
          </div>
          <div class="score-title">${esc(set.title)}</div>
        </div>
        <div class="result-actions">
          ${wrong.length > 0 ? `<button class="btn-retry-wrong" data-action="retry-wrong">🔄 Practice Wrong Only (${wrong.length} questions)</button>` : ''}
          <button class="btn-retry-all" data-action="retry-all">🔁 Retry All</button>
          <button class="btn-home" data-action="home">🏠 Back to Home</button>
        </div>
        ${reviewHTML}
      </div>
    </div>
  `;
}

// ============================================================
// EVENT HANDLERS
// ============================================================
function attachHandlers() {
  document.querySelectorAll('[data-action]').forEach(el => {
    const action = el.getAttribute('data-action');
    if (action === 'start') {
      el.addEventListener('click', () => startQuiz(parseInt(el.getAttribute('data-idx'))));
    } else if (action === 'mcq') {
      el.addEventListener('click', () => {
        if (state.submitted) return;
        state.userAnswer = el.getAttribute('data-idx');
        render();
      });
    } else if (action === 'fill-input') {
      el.addEventListener('input', e => { state.userAnswer = e.target.value; updateSubmitButton(); });
    } else if (action === 'multifill-input') {
      const i = parseInt(el.getAttribute('data-idx'));
      el.addEventListener('input', e => { state.userMultiAnswers[i] = e.target.value; updateSubmitButton(); });
    } else if (action === 'toggle-hint') {
      el.addEventListener('click', () => { state.showHint = true; render(); });
    } else if (action === 'submit') {
      el.addEventListener('click', submitAnswer);
    } else if (action === 'next') {
      el.addEventListener('click', nextQuestion);
    } else if (action === 'exit') {
      el.addEventListener('click', () => {
        if (confirm('Exit this practice? Your progress will not be saved.')) {
          state.view = 'home';
          render();
        }
      });
    } else if (action === 'retry-wrong') {
      el.addEventListener('click', retryWrong);
    } else if (action === 'retry-all') {
      el.addEventListener('click', retryAll);
    } else if (action === 'home') {
      el.addEventListener('click', () => { state.view = 'home'; render(); });
    }
  });
}

// Avoid re-rendering on every keystroke (preserves cursor position)
function updateSubmitButton() {
  const q = state.currentSet.questions[state.qIndex];
  const btn = document.querySelector('[data-action="submit"]');
  if (!btn) return;
  const disabled = (q.type === 'mcq' && state.userAnswer === '') ||
    (q.type === 'fill' && !state.userAnswer.trim()) ||
    (q.type === 'rewrite' && !state.userAnswer.trim()) ||
    (q.type === 'multifill' && (state.userMultiAnswers.length < q.blanks || state.userMultiAnswers.some(a => !a || !a.trim())));
  if (disabled) btn.setAttribute('disabled', 'disabled');
  else btn.removeAttribute('disabled');
}

// ============================================================
// ACTIONS
// ============================================================
function startQuiz(idx) {
  state.view = 'quiz';
  state.currentSetIdx = idx;
  state.currentSet = quizSets[idx];
  state.qIndex = 0;
  state.userAnswer = '';
  state.userMultiAnswers = Array(state.currentSet.questions[0]?.blanks || 0).fill('');
  state.submitted = false;
  state.results = [];
  state.showHint = false;
  render();
}

function submitAnswer() {
  const q = state.currentSet.questions[state.qIndex];
  let isCorrect = false;
  let userInput = '';

  if (q.type === 'mcq') {
    isCorrect = parseInt(state.userAnswer) === q.answer;
    userInput = q.options[parseInt(state.userAnswer)] || '(no answer)';
  } else if (q.type === 'fill' || q.type === 'rewrite') {
    userInput = state.userAnswer;
    isCorrect = isMatch(state.userAnswer, q.answer);
  } else if (q.type === 'multifill') {
    userInput = state.userMultiAnswers.join(' | ');
    isCorrect = state.userMultiAnswers.every((ans, i) => isMatch(ans, q.answer[i]));
  }

  state.results.push({
    qIndex: state.qIndex,
    question: q.q,
    userInput,
    isCorrect,
    type: q.type,
    hint: q.hint,
  });
  state.submitted = true;
  render();
}

function nextQuestion() {
  if (state.qIndex < state.currentSet.questions.length - 1) {
    state.qIndex++;
    state.userAnswer = '';
    state.userMultiAnswers = Array(state.currentSet.questions[state.qIndex]?.blanks || 0).fill('');
    state.submitted = false;
    state.showHint = false;
    render();
  } else {
    state.view = 'results';
    render();
  }
}

function retryAll() { startQuiz(state.currentSetIdx); }

function retryWrong() {
  const wrongQs = state.results.filter(r => !r.isCorrect).map(r => state.currentSet.questions[r.qIndex]);
  if (wrongQs.length === 0) {
    alert('🎉 All correct! No wrong answers to review.');
    return;
  }
  state.currentSet = {
    ...state.currentSet,
    title: 'Wrong Review ・ ' + state.currentSet.title,
    questions: wrongQs,
  };
  state.qIndex = 0;
  state.userAnswer = '';
  state.userMultiAnswers = Array(state.currentSet.questions[0]?.blanks || 0).fill('');
  state.submitted = false;
  state.results = [];
  state.showHint = false;
  state.view = 'quiz';
  render();
}

// ============================================================
// INIT
// ============================================================
render();
</script>
</body>
</html>
